name: Fast CDR Ubuntu CI

on:
  workflow_dispatch:
    inputs:
      os-version:
        description: 'OS version to run the workflow'
        required: false
        default: 'ubuntu-22.04'
        type: string
      colcon-args:
        description: 'Extra arguments for colcon cli'
        required: false
        type: string
      cmake-args:
        description: 'Extra arguments for cmake cli'
        required: false
        type: string
      ctest-args:
        description: 'Extra arguments for ctest cli'
        required: false
        type: string
      fastcdr-branch:
        description: 'Branch or tag of Fast CDR repository'
        type: string
        required: true
      run-tests:
        description: 'Run test suite of Fast CDR'
        required: false
        type: boolean
        default: true
      use-ccache:
        description: 'Use CCache to speed up the build'
        required: false
        type: boolean
        default: false

  pull_request:
    types:
      - review_requested
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '!**/CMakeLists.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-ci:
    if: ${{ !(github.event_name == 'pull_request') || !contains(github.event.pull_request.labels.*.name, 'conflicts') }}
    uses: ./.github/workflows/reusable-ci.yml
    with:
      # It would be desirable to have a matrix of ubuntu OS for this job, but due to the issue opened in this ticket:
      # https://github.com/orgs/community/discussions/128118 , it has been set as a single OS job.
      os-version: ${{ inputs.os-version || 'ubuntu-22.04' }}
      label: ${{ format('ubuntu-ci-{0}', inputs.fastcdr-branch || github.ref) }}
      colcon-args: ${{ inputs.colcon-args }}
      cmake-args: ${{ inputs.cmake-args }}
      ctest-args: ${{ inputs.ctest-args }}
      fastcdr-branch: ${{ inputs.fastcdr-branch || github.ref }}
      run-build: ${{ !(github.event_name == 'pull_request') ||
                     !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
      run-tests: ${{ (inputs.run-tests == true) ||
                     (
                       (github.event_name == 'pull_request') &&
                       (!contains(github.event.pull_request.labels.*.name, 'no-test')) &&
                       (!contains(github.event.pull_request.labels.*.name, 'skip-ci'))
                     ) }}
      use-ccache: ${{ inputs.use-ccache || false }}
      add-label: ${{ (github.event_name == 'pull_request') &&
                     (github.event.pull_request.head.repo.full_name == github.repository) &&
                     (!contains(github.event.pull_request.labels.*.name, 'skip-ci')) &&
                     true || false }}

  # Fast CDR compiled as the FACE CTS compiles a Unit of Conformance (utils/face/check_face.py), apart from the build
  # and test matrix: it only needs the configured sources, and fetches the gold standard files of the CTS
  face-check:
    if: ${{ !(github.event_name == 'pull_request') ||
            (!contains(github.event.pull_request.labels.*.name, 'conflicts') &&
             !contains(github.event.pull_request.labels.*.name, 'skip-ci')) }}
    runs-on: ubuntu-22.04
    steps:
      - name: Sync eProsima/Fast-CDR repository
        uses: eProsima/eProsima-CI/external/checkout@v0
        with:
          path: src/fastcdr
          ref: ${{ inputs.fastcdr-branch || github.ref }}

      - name: Configure Fast CDR
        run: cmake -S src/fastcdr -B build/fastcdr -DFASTCDR_DISABLE_WSTRINGS=ON

      - name: FACE check (C++11 General Purpose capability set)
        run: |
          python3 src/fastcdr/utils/face/check_face.py \
            --source-dir src/fastcdr \
            --build-dir build/fastcdr \
            --work-dir build/face \
            --define FASTCDR_SOURCE
